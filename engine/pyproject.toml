[project]
name = "modelrouter"
version = "0.1.0"
description = "Model router for Chat Completions and text/function Responses requests with typed, legible decisions."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
]

[project.optional-dependencies]
mcp = ["mcp>=2.2,<3"]
test = ["pytest>=8"]

[project.scripts]
modelrouter = "modelrouter.cli:main"
modelrouter-mcp = "modelrouter.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["modelrouter"]

# Add inside the existing `server { server_name chloe.blumenkraft.cloud; listen 443 ssl; ... }`
# block of /etc/nginx/conf.d/chloe-blumenkraft.conf. Public base URL for callers:
#   https://chloe.blumenkraft.cloud/modelrouter/v1
location /modelrouter/ {
    proxy_pass http://127.0.0.1:8687/;          # trailing slash strips the /modelrouter prefix
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;                         # streamed completions pass through as they arrive
    proxy_read_timeout 300s;
    client_max_body_size 4m;
}
# Operator routes (/router/*) are refused to caller keys by the app itself (403); the operator
# token is required for them. Nothing else is exposed.
